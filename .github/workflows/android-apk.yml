name: NEXORA X — Android Debug APK CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_reason:
        description: 'Optional note for this manual APK build'
        required: false
        default: 'Manual workflow_dispatch build'
        type: string

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'
  COMPILE_SDK: '35'
  BUILD_TOOLS_VERSION: '35.0.0'
  APP_MODULE: ':app'
  APK_OUTPUT_DIR: 'app/build/outputs/apk/debug'

jobs:
  build-debug-apk:
    name: Test & Assemble NEXORA X Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Install JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 3. Set Up Android SDK (API 35 & Build-Tools 35.0.0)
        id: android_sdk_setup
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "${SDK_ROOT}/licenses" "${SDK_ROOT}/platforms" "${SDK_ROOT}/build-tools"
          sudo chown -R "$USER:$USER" \
            "${SDK_ROOT}/licenses" \
            "${SDK_ROOT}/platforms" \
            "${SDK_ROOT}/build-tools" \
            "${SDK_ROOT}/platform-tools" \
            "${SDK_ROOT}/cmdline-tools" 2>/dev/null || true

          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "sdk.dir=${SDK_ROOT}" > local.properties

          # Locate pre-installed sdkmanager on GitHub Ubuntu runner without self-overwriting cmdline-tools/16.0
          SDKMANAGER=""
          if [ -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          else
            FOUND_SDKM=$(find "${SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name "sdkmanager" 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "${FOUND_SDKM}" ] && [ -x "${FOUND_SDKM}" ]; then
              SDKMANAGER="${FOUND_SDKM}"
            fi
          fi

          # Fallback: download official Android command-line tools only if no sdkmanager is present on the runner
          if [ -z "${SDKMANAGER}" ]; then
            echo "No pre-installed sdkmanager found; installing commandlinetools-linux-11076708_latest.zip..."
            mkdir -p "${SDK_ROOT}/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q -o /tmp/cmdtools.zip -d "${SDK_ROOT}/cmdline-tools"
            mv "${SDK_ROOT}/cmdline-tools/cmdline-tools" "${SDK_ROOT}/cmdline-tools/latest"
            rm -f /tmp/cmdtools.zip
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager binary: ${SDKMANAGER}"
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --version

          # Accept all Android SDK licenses deterministically (both hash files and sdkmanager --licenses)
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "${SDK_ROOT}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "${SDK_ROOT}/licenses/android-sdk-preview-license"
          yes 2>/dev/null | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null || true

          # Install required Android SDK packages if not already present on the runner
          PACKAGES_TO_INSTALL=()
          if [ ! -d "${SDK_ROOT}/platform-tools" ]; then
            PACKAGES_TO_INSTALL+=("platform-tools")
          fi
          if [ ! -f "${SDK_ROOT}/platforms/android-${COMPILE_SDK}/android.jar" ]; then
            PACKAGES_TO_INSTALL+=("platforms;android-${COMPILE_SDK}")
          fi
          if [ ! -d "${SDK_ROOT}/build-tools/${BUILD_TOOLS_VERSION}" ]; then
            PACKAGES_TO_INSTALL+=("build-tools;${BUILD_TOOLS_VERSION}")
          fi

          if [ "${#PACKAGES_TO_INSTALL[@]}" -gt 0 ]; then
            echo "Installing missing SDK packages: ${PACKAGES_TO_INSTALL[*]}"
            yes 2>/dev/null | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" "${PACKAGES_TO_INSTALL[@]}" || true
          else
            echo "All required SDK packages (platform-tools, platforms;android-${COMPILE_SDK}, build-tools;${BUILD_TOOLS_VERSION}) are already pre-installed on runner."
          fi

          # Strictly verify required SDK components exist on disk
          test -f "${SDK_ROOT}/platforms/android-${COMPILE_SDK}/android.jar"
          test -d "${SDK_ROOT}/build-tools/${BUILD_TOOLS_VERSION}"
          echo "Verified android-${COMPILE_SDK} and build-tools ${BUILD_TOOLS_VERSION} at ${SDK_ROOT}"

          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/build-tools/${BUILD_TOOLS_VERSION}" >> "$GITHUB_PATH"

      - name: 4. Configure Gradle 8.9 & Dependency Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: 5. Ensure Gradle Wrapper Binary & Executable Permissions
        run: |
          chmod +x ./gradlew
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Bootstrapping gradle-wrapper.jar using Gradle ${GRADLE_VERSION}..."
            gradle wrapper --gradle-version "${GRADLE_VERSION}"
            chmod +x ./gradlew
          fi

      - name: 6. Verify Gradle Version (./gradlew --version)
        id: gradle_version
        run: |
          ./gradlew --version

      - name: 7. Verify Gradle Tasks (./gradlew tasks)
        id: gradle_tasks
        run: |
          ./gradlew tasks --all

      - name: 8. Run Unit Tests (./gradlew testDebugUnitTest)
        id: unit_tests
        run: |
          set -o pipefail
          echo "Running NEXORA X unit test suites (Phase 1, Phase 2, Phase 3)..."
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee -a gradle-build.log

      - name: 9. Build Android Debug APK (./gradlew assembleDebug)
        id: assemble_debug
        run: |
          set -o pipefail
          echo "Assembling NEXORA X Debug APK (:app:assembleDebug)..."
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a gradle-build.log

      - name: 10. Verify APK Output & Generate build-info.txt
        id: verify_and_metadata
        run: |
          set -euo pipefail

          echo "Inspecting APK output directory: ${APK_OUTPUT_DIR}"
          if [ ! -d "${APK_OUTPUT_DIR}" ]; then
            echo "::error::APK output directory '${APK_OUTPUT_DIR}' was not created by assembleDebug."
            exit 1
          fi

          APK_FILE=$(find "${APK_OUTPUT_DIR}" -maxdepth 1 -type f -name "*.apk" | head -n 1 || true)
          if [ -z "${APK_FILE}" ] || [ ! -s "${APK_FILE}" ]; then
            echo "::error::No valid non-empty Debug APK file was found in '${APK_OUTPUT_DIR}'."
            exit 1
          fi

          APK_FILENAME=$(basename "${APK_FILE}")
          APK_BYTES=$(wc -c < "${APK_FILE}" | tr -d ' ')
          APK_SHA256=$(sha256sum "${APK_FILE}" | awk '{print $1}')

          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          SINGBOX_VERSION=$(grep -E 'PINNED_SING_BOX_VERSION\s*=' app/src/main/java/com/nexora/x/core/engine/LibboxManager.kt | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || echo "1.10.7")
          BUILD_DATE_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat <<EOF > build-info.txt
          ============================================================
          NEXORA X — ANDROID BUILD INFORMATION
          ============================================================
          App Name         : NEXORA X
          Package Name     : com.nexora.x (Debug App ID: com.nexora.x.debug)
          Build Date (UTC) : ${BUILD_DATE_UTC}
          Git Commit SHA   : ${GITHUB_SHA}
          Git Ref / Branch : ${GITHUB_REF_NAME}
          Build Variant    : debug
          Version Name     : ${VERSION_NAME}-debug (base: ${VERSION_NAME})
          Version Code     : ${VERSION_CODE}
          sing-box Version : ${SINGBOX_VERSION} (io.nekohasekai.libbox)
          JDK Version      : ${JAVA_VERSION} (Eclipse Temurin)
          Gradle Version   : ${GRADLE_VERSION}
          APK File Name    : ${APK_FILENAME}
          APK File Path    : ${APK_FILE}
          APK Size (Bytes) : ${APK_BYTES}
          APK SHA-256      : ${APK_SHA256}
          ============================================================
          EOF

          cp build-info.txt "${APK_OUTPUT_DIR}/build-info.txt"
          cat build-info.txt

          {
            echo "### NEXORA X Debug APK Build Succeeded"
            echo ""
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| **App Name** | \`NEXORA X\` |"
            echo "| **Package Name** | \`com.nexora.x\` (\`com.nexora.x.debug\`) |"
            echo "| **Build Variant** | \`debug\` |"
            echo "| **Version Name** | \`${VERSION_NAME}-debug\` |"
            echo "| **Version Code** | \`${VERSION_CODE}\` |"
            echo "| **sing-box Version** | \`${SINGBOX_VERSION}\` (\`io.nekohasekai.libbox\`) |"
            echo "| **Git Commit SHA** | \`${GITHUB_SHA}\` |"
            echo "| **Build Date (UTC)** | \`${BUILD_DATE_UTC}\` |"
            echo "| **APK File** | \`${APK_FILE}\` (\`${APK_BYTES}\` bytes) |"
            echo "| **APK SHA-256** | \`${APK_SHA256}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 11. Upload NEXORA-X-APK Artifact (APK + build-info.txt)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-X-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            build-info.txt
          retention-days: 14
          if-no-files-found: error

      - name: 12. Diagnose Build or Test Failure
        if: failure()
        run: |
          echo "::error::NEXORA X workflow failed. Inspecting failing stage and Gradle logs..."
          FAILED_TASK="Unknown Gradle / Setup Task"
          CAUSE_EXPLANATION="A setup or Gradle initialization step failed before task execution."
          CONCRETE_FIX="Verify gradle/libs.versions.toml, JDK 17 setup, and network access to Google Maven / Maven Central."

          if [ "${{ steps.android_sdk_setup.outcome }}" == "failure" ]; then
            FAILED_TASK="3. Set Up Android SDK"
            CAUSE_EXPLANATION="Android SDK package installation or license acceptance failed."
            CONCRETE_FIX="Verify ANDROID_HOME permissions and availability of platforms;android-35 and build-tools;35.0.0."
          elif [ "${{ steps.unit_tests.outcome }}" == "failure" ]; then
            FAILED_TASK=":app:testDebugUnitTest"
            CAUSE_EXPLANATION="One or more JUnit 4 unit tests in app/src/test/ failed, or test compilation encountered a Kotlin/KSP error."
            CONCRETE_FIX="Inspect the stacktrace under step '8. Run Unit Tests' or app/build/reports/tests/testDebugUnitTest/index.html."
          elif [ "${{ steps.assemble_debug.outcome }}" == "failure" ]; then
            FAILED_TASK=":app:assembleDebug"
            CAUSE_EXPLANATION="Android Debug APK compilation, KSP (Room/Hilt) code generation, or resource packaging failed."
            CONCRETE_FIX="Check step '9. Build Android Debug APK' for unresolved symbols, Room schema errors, or AndroidManifest.xml issues."
          elif [ "${{ steps.verify_and_metadata.outcome }}" == "failure" ]; then
            FAILED_TASK="APK Verification (verify_and_metadata)"
            CAUSE_EXPLANATION="Gradle finished without producing a non-empty .apk file in app/build/outputs/apk/debug/."
            CONCRETE_FIX="Verify that ':app' applies the 'com.android.application' plugin and that debug buildType is enabled in app/build.gradle.kts."
          fi

          echo "============================================================"
          echo "NEXORA X — FAILURE DIAGNOSTIC REPORT"
          echo "============================================================"
          echo "Failing Task  : ${FAILED_TASK}"
          echo "Root Cause    : ${CAUSE_EXPLANATION}"
          echo "Suggested Fix : ${CONCRETE_FIX}"
          echo "Artifact Note : No fake or incomplete APK was uploaded."
          echo "============================================================"

          {
            echo "### NEXORA X Build Failed"
            echo "- **Failing Task:** \`${FAILED_TASK}\`"
            echo "- **Root Cause:** ${CAUSE_EXPLANATION}"
            echo "- **Concrete Fix:** ${CONCRETE_FIX}"
            echo "- **Artifact Safety:** Artifact upload was skipped so no incomplete or corrupted APK is published."
          } >> "$GITHUB_STEP_SUMMARY"
