name: NEXORA X — Android APK & Google Play Release AAB CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_reason:
        description: 'Optional note for this manual APK / AAB build'
        required: false
        default: 'Manual workflow_dispatch build'
        type: string

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'
  COMPILE_SDK: '35'
  BUILD_TOOLS_VERSION: '35.0.0'
  APP_MODULE: ':app'
  APK_OUTPUT_DIR: 'app/build/outputs/apk/debug'
  AAB_OUTPUT_DIR: 'app/build/outputs/bundle/release'
  SINGBOX_PINNED_VERSION: '1.10.7'

jobs:
  build-debug-apk:
    name: Test, Assemble Debug APK & Bundle Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Install JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 3. Set Up Android SDK (API 35 & Build-Tools 35.0.0)
        id: android_sdk_setup
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "${SDK_ROOT}/licenses" "${SDK_ROOT}/platforms" "${SDK_ROOT}/build-tools"
          sudo chown -R "$USER:$USER" \
            "${SDK_ROOT}/licenses" \
            "${SDK_ROOT}/platforms" \
            "${SDK_ROOT}/build-tools" \
            "${SDK_ROOT}/platform-tools" \
            "${SDK_ROOT}/cmdline-tools" 2>/dev/null || true

          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "sdk.dir=${SDK_ROOT}" > local.properties

          SDKMANAGER=""
          if [ -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          else
            FOUND_SDKM=$(find "${SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name "sdkmanager" 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "${FOUND_SDKM}" ] && [ -x "${FOUND_SDKM}" ]; then
              SDKMANAGER="${FOUND_SDKM}"
            fi
          fi

          if [ -z "${SDKMANAGER}" ]; then
            echo "No pre-installed sdkmanager found; installing commandlinetools-linux-11076708_latest.zip..."
            mkdir -p "${SDK_ROOT}/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q -o /tmp/cmdtools.zip -d "${SDK_ROOT}/cmdline-tools"
            mv "${SDK_ROOT}/cmdline-tools/cmdline-tools" "${SDK_ROOT}/cmdline-tools/latest"
            rm -f /tmp/cmdtools.zip
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager binary: ${SDKMANAGER}"
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --version

          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "${SDK_ROOT}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "${SDK_ROOT}/licenses/android-sdk-preview-license"
          yes 2>/dev/null | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null || true

          PACKAGES_TO_INSTALL=()
          if [ ! -d "${SDK_ROOT}/platform-tools" ]; then
            PACKAGES_TO_INSTALL+=("platform-tools")
          fi
          if [ ! -f "${SDK_ROOT}/platforms/android-${COMPILE_SDK}/android.jar" ]; then
            PACKAGES_TO_INSTALL+=("platforms;android-${COMPILE_SDK}")
          fi
          if [ ! -d "${SDK_ROOT}/build-tools/${BUILD_TOOLS_VERSION}" ]; then
            PACKAGES_TO_INSTALL+=("build-tools;${BUILD_TOOLS_VERSION}")
          fi

          if [ "${#PACKAGES_TO_INSTALL[@]}" -gt 0 ]; then
            echo "Installing missing SDK packages: ${PACKAGES_TO_INSTALL[*]}"
            yes 2>/dev/null | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" "${PACKAGES_TO_INSTALL[@]}" || true
          else
            echo "All required SDK packages (platform-tools, platforms;android-${COMPILE_SDK}, build-tools;${BUILD_TOOLS_VERSION}) are already pre-installed on runner."
          fi

          test -f "${SDK_ROOT}/platforms/android-${COMPILE_SDK}/android.jar"
          test -d "${SDK_ROOT}/build-tools/${BUILD_TOOLS_VERSION}"
          echo "Verified android-${COMPILE_SDK} and build-tools ${BUILD_TOOLS_VERSION} at ${SDK_ROOT}"

          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/build-tools/${BUILD_TOOLS_VERSION}" >> "$GITHUB_PATH"

      - name: 4. Assemble & Verify Official sing-box libbox.aar (v1.10.7)
        id: prepare_libbox_aar
        run: |
          set -euo pipefail
          if [ -f "scripts/fetch-libbox-aar.sh" ]; then
            chmod +x scripts/fetch-libbox-aar.sh
            ./scripts/fetch-libbox-aar.sh
          elif [ -f "app/libs/fetch-libbox-aar.sh" ]; then
            chmod +x app/libs/fetch-libbox-aar.sh
            ./app/libs/fetch-libbox-aar.sh
          else
            echo "Running inline reproducible assembly of app/libs/libbox.aar (v${SINGBOX_PINNED_VERSION})..."
            mkdir -p app/libs /tmp/libbox-work/classes /tmp/libbox-work/aar/jni
            curl -fL --retry 3 "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_PINNED_VERSION}/SFA-${SINGBOX_PINNED_VERSION}-universal.apk" -o /tmp/sfa.apk
            curl -fL --retry 3 "https://raw.githubusercontent.com/singbox-android/libbox/1.3.11/libbox.aar" -o /tmp/gomobile.aar
            curl -fL --retry 3 "https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip" -o /tmp/dex2jar.zip
            unzip -q -o /tmp/dex2jar.zip -d /tmp
            chmod +x /tmp/dex-tools-v2.4/*.sh
            unzip -q /tmp/sfa.apk "classes.dex" "lib/*/libbox.so" -d /tmp/libbox-work/sfa
            /tmp/dex-tools-v2.4/d2j-dex2jar.sh --force -o /tmp/libbox-work/sfa-classes.jar /tmp/libbox-work/sfa/classes.dex
            (cd /tmp/libbox-work/classes && jar xf /tmp/libbox-work/sfa-classes.jar io/nekohasekai/libbox)
            unzip -p /tmp/gomobile.aar classes.jar > /tmp/libbox-work/gomobile-classes.jar
            (cd /tmp/libbox-work/classes && jar xf /tmp/libbox-work/gomobile-classes.jar go)
            jar cf /tmp/libbox-work/aar/classes.jar -C /tmp/libbox-work/classes io -C /tmp/libbox-work/classes go
            for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
              mkdir -p "/tmp/libbox-work/aar/jni/${ABI}"
              cp "/tmp/libbox-work/sfa/lib/${ABI}/libbox.so" "/tmp/libbox-work/aar/jni/${ABI}/libbox.so"
            done
            printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="io.nekohasekai.libbox"><uses-sdk android:minSdkVersion="21"/></manifest>\n' > /tmp/libbox-work/aar/AndroidManifest.xml
            : > /tmp/libbox-work/aar/R.txt
            (cd /tmp/libbox-work/aar && jar cfM "${GITHUB_WORKSPACE}/app/libs/libbox.aar" AndroidManifest.xml R.txt classes.jar jni)
          fi

          test -s "app/libs/libbox.aar"
          unzip -l "app/libs/libbox.aar" | grep -E "classes\.jar|jni/(arm64-v8a|armeabi-v7a|x86_64|x86)/libbox\.so"

      - name: 5. Configure Gradle 8.9 & Dependency Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: 6. Ensure Gradle Wrapper Binary & Executable Permissions
        run: |
          chmod +x ./gradlew
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Bootstrapping gradle-wrapper.jar using Gradle ${GRADLE_VERSION}..."
            gradle wrapper --gradle-version "${GRADLE_VERSION}"
            chmod +x ./gradlew
          fi

      - name: 7. Clean & Verify Gradle Version (./gradlew clean)
        id: gradle_clean
        run: |
          ./gradlew --version
          ./gradlew clean

      - name: 8. Run Unit Tests (./gradlew testDebugUnitTest)
        id: unit_tests
        run: |
          set -o pipefail
          echo "Running NEXORA X unit test suites (Phase 1–4 + Production v1.0.0 + libbox v1.10.7 classpath check)..."
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee -a gradle-build.log

      - name: 9. Build Android Debug APK (./gradlew assembleDebug)
        id: assemble_debug
        run: |
          set -o pipefail
          echo "Assembling NEXORA X Debug APK (:app:assembleDebug)..."
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a gradle-build.log

      - name: 9b. Prepare Optional Release Signing & Build Google Play Release AAB (./gradlew bundleRelease)
        id: bundle_release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && [ -n "${RELEASE_STORE_PASSWORD:-}" ] && [ -n "${RELEASE_KEY_ALIAS:-}" ] && [ -n "${RELEASE_KEY_PASSWORD:-}" ]; then
            echo "Release signing secrets detected; decoding upload keystore to /tmp/nexora-upload.jks..."
            echo "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > /tmp/nexora-upload.jks
            export RELEASE_STORE_FILE="/tmp/nexora-upload.jks"
            echo "RELEASE_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret configured; building unsigned release AAB for R8/Play Bundle verification..."
            echo "RELEASE_SIGNED=false" >> "$GITHUB_ENV"
          fi
          ./gradlew bundleRelease --stacktrace 2>&1 | tee -a gradle-build.log
          rm -f /tmp/nexora-upload.jks

      - name: 10. Verify APK & AAB Outputs, Native libbox.so ABIs & Generate build-info.txt
        id: verify_and_metadata
        run: |
          set -euo pipefail

          echo "Inspecting APK output directory: ${APK_OUTPUT_DIR}"
          if [ ! -d "${APK_OUTPUT_DIR}" ]; then
            echo "::error::APK output directory '${APK_OUTPUT_DIR}' was not created by assembleDebug."
            exit 1
          fi

          APK_FILE=$(find "${APK_OUTPUT_DIR}" -maxdepth 1 -type f -name "*.apk" | head -n 1 || true)
          if [ -z "${APK_FILE}" ] || [ ! -s "${APK_FILE}" ]; then
            echo "::error::No valid non-empty Debug APK file was found in '${APK_OUTPUT_DIR}'."
            exit 1
          fi

          echo "Verifying native libbox.so binaries inside ${APK_FILE}..."
          unzip -l "${APK_FILE}" | grep -E "lib/(arm64-v8a|armeabi-v7a|x86_64|x86)/libbox\.so"
          unzip -l "${APK_FILE}" | grep -q "lib/arm64-v8a/libbox.so"
          unzip -l "${APK_FILE}" | grep -q "lib/armeabi-v7a/libbox.so"
          unzip -l "${APK_FILE}" | grep -q "lib/x86_64/libbox.so"
          unzip -l "${APK_FILE}" | grep -q "lib/x86/libbox.so"

          AAB_FILE=$(find "${AAB_OUTPUT_DIR}" -maxdepth 2 -type f -name "*.aab" | head -n 1 || true)
          AAB_BYTES="N/A"
          AAB_SHA256="N/A"
          if [ -n "${AAB_FILE}" ] && [ -s "${AAB_FILE}" ]; then
            AAB_BYTES=$(wc -c < "${AAB_FILE}" | tr -d ' ')
            AAB_SHA256=$(sha256sum "${AAB_FILE}" | awk '{print $1}')
          fi

          APK_FILENAME=$(basename "${APK_FILE}")
          APK_BYTES=$(wc -c < "${APK_FILE}" | tr -d ' ')
          APK_SHA256=$(sha256sum "${APK_FILE}" | awk '{print $1}')

          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          SINGBOX_VERSION=$(grep -E 'PINNED_SINGBOX_VERSION\s*=' app/src/main/java/com/nexora/x/core/engine/LibboxManager.kt | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || echo "1.10.7")
          BUILD_DATE_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat <<EOF > build-info.txt
          ============================================================
          NEXORA X — ANDROID PRODUCTION BUILD INFORMATION
          ============================================================
          App Name         : NEXORA X
          Package Name     : com.nexora.x (Debug App ID: com.nexora.x.debug)
          Build Date (UTC) : ${BUILD_DATE_UTC}
          Git Commit SHA   : ${GITHUB_SHA}
          Git Ref / Branch : ${GITHUB_REF_NAME}
          Compile / Target : SDK ${COMPILE_SDK} (Min SDK 26)
          Version Name     : ${VERSION_NAME} (Debug: ${VERSION_NAME}-debug)
          Version Code     : ${VERSION_CODE}
          sing-box Version : ${SINGBOX_VERSION} (io.nekohasekai.libbox, app/libs/libbox.aar)
          Native ABIs      : arm64-v8a, armeabi-v7a, x86_64, x86 (libbox.so verified)
          JDK Version      : ${JAVA_VERSION} (Eclipse Temurin)
          Gradle Version   : ${GRADLE_VERSION}
          Debug APK File   : ${APK_FILE} (${APK_BYTES} bytes)
          Debug APK SHA256 : ${APK_SHA256}
          Release AAB File : ${AAB_FILE:-Not generated} (${AAB_BYTES} bytes, Signed: ${RELEASE_SIGNED:-false})
          Release AAB SHA  : ${AAB_SHA256}
          ============================================================
          EOF

          cp build-info.txt "${APK_OUTPUT_DIR}/build-info.txt"
          cat build-info.txt

          {
            echo "### NEXORA X Android Build Succeeded (Debug APK + Release AAB)"
            echo ""
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| **App Name** | \`NEXORA X\` |"
            echo "| **Package Name** | \`com.nexora.x\` (\`com.nexora.x.debug\`) |"
            echo "| **Compile / Target SDK** | \`${COMPILE_SDK}\` (Min SDK \`26\`) |"
            echo "| **Version Name** | \`${VERSION_NAME}\` (Code \`${VERSION_CODE}\`) |"
            echo "| **sing-box Version** | \`${SINGBOX_VERSION}\` (\`io.nekohasekai.libbox\` + \`libbox.so\`) |"
            echo "| **Native ABIs** | \`arm64-v8a\`, \`armeabi-v7a\`, \`x86_64\`, \`x86\` |"
            echo "| **Git Commit SHA** | \`${GITHUB_SHA}\` |"
            echo "| **Build Date (UTC)** | \`${BUILD_DATE_UTC}\` |"
            echo "| **Debug APK** | \`${APK_FILE}\` (\`${APK_BYTES}\` bytes, SHA-256: \`${APK_SHA256}\`) |"
            echo "| **Release AAB** | \`${AAB_FILE:-N/A}\` (\`${AAB_BYTES}\` bytes, Signed: \`${RELEASE_SIGNED:-false}\`) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 11. Upload NEXORA-X-APK Artifact (Debug APK + build-info.txt)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-X-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            build-info.txt
          retention-days: 14
          if-no-files-found: error

      - name: 11b. Upload NEXORA-X-RELEASE-AAB Artifact (Google Play Bundle + build-info.txt)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-X-RELEASE-AAB
          path: |
            app/build/outputs/bundle/release/**/*.aab
            build-info.txt
          retention-days: 14
          if-no-files-found: warn

      - name: 12. Diagnose Build or Test Failure
        if: failure()
        run: |
          echo "::error::NEXORA X workflow failed. Inspecting failing stage and Gradle logs..."
          FAILED_TASK="Unknown Gradle / Setup Task"
          CAUSE_EXPLANATION="A setup or Gradle initialization step failed before task execution."
          CONCRETE_FIX="Verify gradle/libs.versions.toml, JDK 17 setup, and network access to Google Maven / Maven Central."

          if [ "${{ steps.android_sdk_setup.outcome }}" == "failure" ]; then
            FAILED_TASK="3. Set Up Android SDK"
            CAUSE_EXPLANATION="Android SDK package installation or license acceptance failed."
            CONCRETE_FIX="Verify ANDROID_HOME permissions and availability of platforms;android-35 and build-tools;35.0.0."
          elif [ "${{ steps.prepare_libbox_aar.outcome }}" == "failure" ]; then
            FAILED_TASK="4. Assemble & Verify Official sing-box libbox.aar (v1.10.7)"
            CAUSE_EXPLANATION="Failed to download or assemble app/libs/libbox.aar from official SagerNet/sing-box v1.10.7 release."
            CONCRETE_FIX="Verify network connectivity to github.com/SagerNet/sing-box/releases/tag/v1.10.7."
          elif [ "${{ steps.unit_tests.outcome }}" == "failure" ]; then
            FAILED_TASK=":app:testDebugUnitTest"
            CAUSE_EXPLANATION="One or more JUnit 4 unit tests in app/src/test/ failed, or test compilation encountered a Kotlin/KSP error."
            CONCRETE_FIX="Inspect the stacktrace under step '8. Run Unit Tests' or app/build/reports/tests/testDebugUnitTest/index.html."
          elif [ "${{ steps.assemble_debug.outcome }}" == "failure" ]; then
            FAILED_TASK=":app:assembleDebug"
            CAUSE_EXPLANATION="Android Debug APK compilation, KSP (Room/Hilt) code generation, or resource packaging failed."
            CONCRETE_FIX="Check step '9. Build Android Debug APK' for unresolved symbols, Room schema errors, or AndroidManifest.xml issues."
          elif [ "${{ steps.bundle_release.outcome }}" == "failure" ]; then
            FAILED_TASK=":app:bundleRelease"
            CAUSE_EXPLANATION="Google Play Release AAB compilation or R8 minification failed."
            CONCRETE_FIX="Check app/proguard-rules.pro and step '9b. Build Google Play Release AAB' for R8 shrinker issues."
          elif [ "${{ steps.verify_and_metadata.outcome }}" == "failure" ]; then
            FAILED_TASK="APK Verification (verify_and_metadata)"
            CAUSE_EXPLANATION="Gradle finished without producing a non-empty .apk file with lib/*/libbox.so in app/build/outputs/apk/debug/."
            CONCRETE_FIX="Verify that app/libs/libbox.aar is present and referenced via implementation(files(\"libs/libbox.aar\"))."
          fi

          echo "============================================================"
          echo "NEXORA X — FAILURE DIAGNOSTIC REPORT"
          echo "============================================================"
          echo "Failing Task  : ${FAILED_TASK}"
          echo "Root Cause    : ${CAUSE_EXPLANATION}"
          echo "Suggested Fix : ${CONCRETE_FIX}"
          echo "Artifact Note : No fake or incomplete APK was uploaded."
          echo "============================================================"
